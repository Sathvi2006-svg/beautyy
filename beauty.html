<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowCut Salon Bot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:430px;
    height:730px;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
}

.header{
    background:linear-gradient(90deg,#ff4d6d,#ff758f);
    color:white;
    text-align:center;
    padding:22px;
    font-size:30px;
    font-weight:bold;
    letter-spacing:1px;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    background:#fff5f7;
}

.message{
    max-width:80%;
    padding:14px 16px;
    border-radius:20px;
    line-height:1.6;
    font-size:16px;
    white-space:pre-line;
}

.bot{
    background:white;
    color:#333;
    align-self:flex-start;
    border:1px solid #ffd1dc;
}

.user{
    background:#ff4d6d;
    color:white;
    align-self:flex-end;
}

.input-area{
    display:flex;
    gap:10px;
    padding:15px;
    background:white;
    border-top:1px solid #eee;
}

input{
    flex:1;
    padding:15px;
    border:1px solid #ffd1dc;
    border-radius:15px;
    outline:none;
    font-size:16px;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px 22px;
    border-radius:15px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    background:#e63956;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        ✂️ GlowCut Salon
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">

        <input 
            type="text"
            id="userInput"
            placeholder="Type here..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");

let step = 0;

let salonData = {
    name:"",
    style:"",
    appointment:""
};

function addMessage(text,sender){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(sender);

    msg.innerText = text;

    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;
}

addMessage(
`💇‍♀️ Welcome to GlowCut Salon ✨

We offer trendy hairstyles & premium salon services 💖

What is your name?`,
"bot"
);

function resetChat(){

    step = 0;

    salonData = {
        name:"",
        style:"",
        appointment:""
    };

    setTimeout(() => {

        addMessage(
`🌸 New Salon Booking Started!

What is your name?`,
"bot"
        );

    },2500);
}

function sendMessage(){

    const text = input.value.trim();

    if(text === "") return;

    addMessage(text,"user");

    // NAME

    if(step === 0){

        salonData.name = text;

        setTimeout(() => {

            addMessage(
`✨ Hi ${salonData.name}!

Choose your hairstyle 💇

🌟 Available Styles:

• Layer Cut
• Bob Cut
• Wolf Cut
• Butterfly Cut
• Curly Hair Styling
• Hair Smoothening
• Hair Coloring
• Keratin Treatment

Which style would you like?`,
"bot"
            );

        },500);

        step++;
    }

    // STYLE

    else if(step === 1){

        salonData.style = text;

        setTimeout(() => {

            addMessage(
`📅 Please select your appointment date & time 💖

Examples:
• Tomorrow 11 AM
• Monday 5 PM
• Friday 3 PM`,
"bot"
            );

        },500);

        step++;
    }

    // APPOINTMENT

    else if(step === 2){

        salonData.appointment = text;

        localStorage.setItem(
            "salonBooking",
            JSON.stringify(salonData)
        );

        const summary = `✅ Appointment Booked Successfully 💖

👤 Name: ${salonData.name}

💇 Hairstyle: ${salonData.style}

📅 Appointment: ${salonData.appointment}

✨ Thank you for choosing GlowCut Salon!

🌸 We can't wait to style your look 💅`;

        setTimeout(() => {

            addMessage(summary,"bot");

        },500);

        step++;

        resetChat();
    }

    input.value = "";
}

input.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        sendMessage();
    }
});

</script>

</body>
</html>
